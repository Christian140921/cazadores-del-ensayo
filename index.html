<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cazadores del Ensayo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Caveat:wght@500;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<!-- ?v=… obliga al navegador a bajar todos los archivos juntos cuando hay una versión nueva: cámbiala en todas las líneas al publicar un cambio -->
<link rel="stylesheet" href="css/estilos.css?v=2026-10-18b">
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="wrap">
  <header class="top">
    <button class="logo" id="goHome" aria-label="Ir al inicio">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 36 Q20 34 34 36 M12 36 Q10 20 13 5 M10 6 Q20 4 29 6 M29 6 Q30 10 29 13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" filter="url(#rough)"/><circle cx="29" cy="17" r="4" fill="none" stroke="#D0342C" stroke-width="3"/></svg>
      Cazadores del Ensayo
    </button>
    <div class="tools">
      <button class="tbtn" id="goMenu" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7M6 9.5V20h12V9.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Menú<b class="ancho"> principal</b></span>
      </button>
      <button class="tbtn" id="goGuide">Guía</button>
      <button class="tbtn" id="tMusic" aria-pressed="true" aria-label="Música">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.6" fill="currentColor"/><circle cx="17.5" cy="16" r="2.6" fill="currentColor"/><path class="off" d="M3 3 21 21" stroke="#D0342C" stroke-width="2.6" stroke-linecap="round"/></svg>
        <span class="on">Música</span><span class="off">Sin música</span>
      </button>
      <button class="tbtn" id="tSfx" aria-pressed="true" aria-label="Efectos de sonido">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="on" d="M16 8.5q2.5 3.5 0 7M18.5 6q4.5 6 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="off" d="M16.5 9.5l5 5m0-5-5 5" stroke="#D0342C" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span class="on">Sonidos</span><span class="off">Silencio</span>
      </button>
    </div>
  </header>
  <main id="app"></main>
</div>
<canvas id="confeti" hidden></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
