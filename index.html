<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cazadores del Ensayo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Caveat:wght@500;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Mundo: una hoja de cuaderno cuadriculado. Recortes de ensayos pegados con cinta, destacadores de colores,
   y un ahorcado dibujado a mano con plumón. Un solo tema claro a propósito: se ve como papel, también en el proyector. */
:root{
  color-scheme:light;
  --paper:#FCFCF8; --grid:#DCE7F2; --sheet:#FFFFFF; --tape:rgba(226,212,170,.72);
  --ink:#1D2740; --pencil:#4A5168; --soft:#6B7290; --pen:#2244B0; --red:#D0342C; --green:#1E8048;
  --hl-intro:#FFE45E; --hl-tesis:#FF9DCB; --hl-arg:#86E0A3; --hl-contra:#FFB867; --hl-concl:#9BCFFF; --hl-pon:#C9B6FF;
  --f-marker:"Permanent Marker", "Comic Sans MS", "Segoe Print", cursive;
  --f-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --shadow:0 1px 1px rgba(29,39,64,.06), 0 6px 18px -6px rgba(29,39,64,.22);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
::selection{background:var(--hl-intro);color:var(--ink)}
html{background:var(--paper)}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-read);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;background-position:-1px -1px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px;min-height:100vh;box-sizing:border-box}
.wrap{max-width:1000px;margin:0 auto}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance;line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px dashed var(--pen);outline-offset:3px}
svg.defs{position:absolute;width:0;height:0}

/* Barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.logo{font-family:var(--f-marker);font-size:22px;background:none;border:0;padding:5px 0;min-height:44px;display:flex;align-items:center;gap:10px}
.logo svg{width:34px;height:34px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#goMenu .ancho{font-weight:inherit}
@media (max-width:520px){ #goMenu .ancho{display:none} .top .tools{gap:6px} .top .tbtn{font-size:18px;padding:4px 10px 4px 8px;gap:4px} .top .tbtn svg{width:18px;height:18px} }
.tbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:2px solid var(--ink);background:var(--sheet);border-radius:999px;padding:5px 14px 5px 10px;font-family:var(--f-hand);font-size:21px;font-weight:700;line-height:1}
.tbtn svg{width:20px;height:20px;flex:none}
.tbtn[aria-pressed="false"]{opacity:.6}
.tbtn[aria-pressed="false"] .on{display:none}
.tbtn[aria-pressed="true"] .off{display:none}
.tbtn.wake{background:var(--hl-intro);animation:llama 1.6s ease-in-out infinite}
@keyframes llama{50%{transform:scale(1.06)}}

/* Botones "de cuaderno" */
.btn{position:relative;font-family:var(--f-hand);font-weight:700;font-size:26px;line-height:1;padding:12px 24px 14px;border:2.5px solid var(--ink);
  border-radius:14px 18px 13px 20px / 18px 12px 20px 14px;background:var(--sheet);box-shadow:0 3px 0 -1px var(--ink);transition:transform .15s cubic-bezier(.2,.8,.2,1), box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 -1px var(--ink)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 -1px var(--ink)}
.btn.go{background:var(--ink);color:var(--paper)}
.btn.go:hover:not(:disabled){box-shadow:0 5px 0 -1px var(--pen)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{font-size:21px;padding:8px 16px 10px}

/* Destacador */
.hl{background-image:linear-gradient(var(--c),var(--c));background-repeat:no-repeat;background-size:100% 62%;background-position:0 78%;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .14em;margin:0 -.06em;border-radius:3px 6px 4px 7px}
.hl.sweep{transition:background-size .75s cubic-bezier(.22,1,.36,1)}
.hl.sweep.off{background-size:0% 62%}

/* Hoja pegada con cinta */
.sheet{position:relative;background:var(--sheet);box-shadow:var(--shadow);border-radius:3px;padding:26px clamp(18px,3.5vw,32px) 24px}
.sheet::before,.sheet::after{content:"";position:absolute;top:-12px;width:86px;height:26px;background:var(--tape);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.sheet::before{left:18px;transform:rotate(-5deg)}
.sheet::after{right:18px;transform:rotate(4deg)}
.tilt-l{transform:rotate(-.7deg)} .tilt-r{transform:rotate(.6deg)}
.hand{font-family:var(--f-hand);font-weight:700}
.note{font-family:var(--f-hand);font-size:24px;color:var(--pen);line-height:1.15}

/* Inicio */
.hero{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,.75fr);gap:24px;align-items:center;padding-block:18px 26px}
.hero h1{font-family:var(--f-marker);font-size:clamp(48px,8.6vw,92px);letter-spacing:-.01em;line-height:.98}
.hero h1 .hl{--c:var(--hl-tesis)}
.hero p{max-width:46ch;margin:18px 0 0;font-size:19px}
.hero-art{position:relative;display:grid;justify-items:center}
.hero-art .horca{width:min(100%,260px)}
.hero-art .note{position:absolute;left:-6px;top:6px;transform:rotate(-8deg);max-width:9ch}
.hero-art .arrow{position:absolute;left:62px;top:70px;width:70px;height:60px;color:var(--pen)}
.pieces{display:flex;flex-wrap:wrap;gap:8px 9px;align-items:center;margin-top:22px}
.pieces span{font-family:var(--f-hand);font-weight:700;font-size:22px;line-height:1.1}
.pieces b{flex-basis:100%;font-family:var(--f-hand);font-weight:700;font-size:19px;color:var(--soft);line-height:1;margin-bottom:-4px}
.pieces.pon{margin-top:16px}
.y-pon{font-family:var(--f-hand);font-weight:700;font-size:clamp(30px,4.4vw,46px);line-height:1;margin-top:8px;transform:rotate(-2deg);transform-origin:left}
.pieces i{font-style:normal;color:var(--soft);font-family:var(--f-hand);font-size:22px}
.modes{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:34px 28px;align-items:start;margin-top:14px}
.modes h2{font-family:var(--f-marker);font-size:36px}
.modes p{margin:8px 0 0}
.opts{display:grid;gap:14px;margin-top:18px}
.opt{display:grid;gap:6px}
.opt>span{font-family:var(--f-hand);font-weight:700;font-size:22px;color:var(--pencil);line-height:1}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-family:var(--f-hand);font-weight:700;font-size:22px;line-height:1;padding:6px 14px 8px;border:2px solid transparent;background:none;border-radius:40% 45% 42% 48% / 55% 45% 55% 45%}
.seg button[aria-pressed="true"]{border-color:var(--red);color:var(--red)}
.seg button:hover{background:rgba(29,39,64,.05)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:4px}
.teams input{width:100%;font-family:var(--f-hand);font-weight:700;font-size:22px;padding:4px 2px;border:0;border-bottom:2px solid var(--pencil);background:transparent;color:var(--ink);border-radius:0}
.teams input:focus{outline:none;border-bottom-color:var(--pen)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;align-items:center}

/* Juego */
.hud{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding-block:2px 10px}
.prog{font-family:var(--f-hand);font-weight:700;font-size:26px;line-height:1}
.prog small{font-size:22px;color:var(--red);margin-left:8px}
.pencil-bar{flex:1 1 200px;height:12px;position:relative;min-width:120px}
.pencil-bar svg{width:100%;height:12px;display:block;overflow:visible}
.timer{font-family:var(--f-marker);font-size:28px;font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
.timer.low{color:var(--red);animation:late 1s infinite}
@keyframes late{50%{transform:scale(1.12)}}
.scores{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.score{display:flex;align-items:center;gap:6px;padding:2px 12px 2px 4px;border:2px solid transparent;border-radius:30px;font-family:var(--f-hand);font-weight:700;font-size:22px;line-height:1;background:var(--sheet);box-shadow:var(--shadow)}
.score svg{width:34px;height:40px}
.score b{font-family:var(--f-marker);font-weight:400;font-size:18px;color:var(--pen)}
.score.turn{border-color:var(--ink)}
.score.out{opacity:.5;text-decoration:line-through}
.turnline{font-family:var(--f-hand);font-weight:700;font-size:30px;line-height:1.1;margin-block:4px 2px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:26px;align-items:start;margin-top:16px}
.stage .main{min-width:0}
.clip .tema{font-family:var(--f-hand);font-weight:700;font-size:22px;color:var(--soft);line-height:1;margin-bottom:12px}
.clip blockquote{margin:0;font-size:clamp(21px,2.9vw,29px);line-height:1.5;font-weight:400}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px 14px;margin-top:22px}
.ans{position:relative;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:var(--sheet);box-shadow:var(--shadow);border-radius:6px;padding:10px 14px 12px 10px;
  font-family:var(--f-hand);font-weight:700;font-size:28px;line-height:1;min-width:0;transition:transform .15s cubic-bezier(.2,.8,.2,1)}
.ans .cap{flex:none;width:30px;height:30px;border-radius:7px 9px 6px 10px;background:var(--c);display:grid;place-items:center;font-family:var(--f-marker);font-size:16px;color:var(--ink)}
.ans .txt{min-width:0;overflow-wrap:normal;font-size:clamp(23px,2.1vw,27px)}
@media (min-width:900px) and (max-height:820px){ .clip blockquote{font-size:23px;line-height:1.4} .side .horca{max-width:170px} .answers{margin-top:14px} .pregunta{margin-top:14px} }
@media (hover:none){ .keys{display:none} }
.pregunta{font-family:var(--f-hand);font-weight:700;font-size:clamp(23px,2.8vw,30px);line-height:1.15;margin:22px 0 -6px}
.temas2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}
.temaop{display:grid;gap:6px;text-align:left;border:2px solid var(--ink);background:var(--sheet);border-radius:8px;padding:16px 18px;font-family:var(--f-read);font-size:16px;line-height:1.4;color:var(--ink)}
.temaop b{font-family:var(--f-marker);font-weight:400;font-size:clamp(26px,3vw,32px);line-height:1}
.temaop[aria-pressed="true"]{border-width:3px;background:var(--c);box-shadow:var(--shadow)}
.answers.pon{grid-template-columns:1fr}
.duelo{display:grid;gap:8px;margin:18px 0}
.duelo div{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--sheet);box-shadow:var(--shadow);border-radius:4px;padding:8px 18px;font-family:var(--f-hand);font-weight:700;font-size:clamp(24px,3vw,32px)}
.duelo div.gana{outline:3px solid var(--green)} .duelo .ok{color:var(--green)} .duelo .no{color:var(--red)} .answers.pon .ans .txt{font-size:clamp(19px,2.2vw,23px);line-height:1.15}
.part.pon .n{color:#7A5CD6}
.ans:hover:not(:disabled){transform:translateY(-3px) rotate(-.8deg)}
.ans:disabled{cursor:default}
.ans.dim{opacity:.4}
.ans.right::after{content:"";position:absolute;inset:-7px -6px -6px -8px;border:3px solid var(--green);border-radius:52% 46% 50% 44% / 58% 50% 54% 46%;transform:rotate(-2deg);pointer-events:none}
.ans.wrong .txt{position:relative}
.ans.wrong .txt::after{content:"";position:absolute;left:-4px;right:-6px;top:52%;height:4px;background:var(--red);border-radius:3px;transform:rotate(-4deg)}
.ans.wrong{color:var(--red)}
.side{display:grid;gap:4px;justify-items:center;position:sticky;top:12px}
.side .horca{width:100%;max-width:220px}
.lives{font-family:var(--f-hand);font-weight:700;font-size:26px;line-height:1;text-align:center}
.lives .tally{display:block;font-family:var(--f-marker);font-size:22px;letter-spacing:3px;color:var(--red);margin-top:4px;min-height:1em}
.lives.dead{color:var(--red)}
.fb{margin-top:26px;position:relative;background:var(--sheet);box-shadow:var(--shadow);border-radius:3px;padding:20px clamp(18px,3vw,28px) 18px clamp(30px,5vw,56px);
  background-image:linear-gradient(90deg, transparent 0 clamp(18px,3.4vw,40px), rgba(208,52,44,.45) 0 calc(clamp(18px,3.4vw,40px) + 2px), transparent 0), repeating-linear-gradient(transparent 0 31px, var(--grid) 31px 32px)}
.fb h3{font-family:var(--f-hand);font-weight:700;font-size:clamp(30px,4vw,40px);line-height:1.05}
.fb.ok h3{color:var(--green)} .fb.no h3{color:var(--red)}
.fb p{margin:8px 0 0;max-width:68ch}
.fb .def{color:var(--pencil);font-size:15.5px}
.fb .cta{justify-content:flex-end;margin-top:12px}
.keys{color:var(--soft);font-family:var(--f-hand);font-size:20px;margin-top:14px}

/* Ordena */
.olist{display:grid;gap:12px}
.strip{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;text-align:left;border:0;background:var(--sheet);box-shadow:var(--shadow);border-radius:3px;padding:14px 18px 14px 12px;font-size:17px;transition:transform .15s cubic-bezier(.2,.8,.2,1)}
.strip:nth-child(odd){transform:rotate(-.35deg)} .strip:nth-child(even){transform:rotate(.35deg)}
button.strip:hover{transform:translateX(4px)}
.strip .num{width:38px;height:38px;display:grid;place-items:center;font-family:var(--f-marker);font-size:20px;color:var(--soft);border:2px dashed var(--grid);border-radius:50%}
.strip.placed .num{color:var(--pen);border:2.5px solid var(--pen);border-radius:46% 54% 50% 48% / 52% 46% 54% 48%}
.strip.placed{opacity:.75}
.strip .tag{display:inline-block;margin-top:8px;font-family:var(--f-hand);font-weight:700;font-size:22px;line-height:1}
.strip.nope{animation:nope .4s}
.strip.nope .num{border-color:var(--red);color:var(--red);border-style:solid}
@keyframes nope{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.lead{font-family:var(--f-hand);font-weight:700;font-size:26px;line-height:1.15;margin:0;max-width:44ch}

/* Guía */
.guide{display:grid;gap:8px;padding-block:8px}
.guide h2{font-family:var(--f-marker);font-size:clamp(36px,6vw,56px)}
.guide>p{max-width:62ch;margin:6px 0 10px}
.part{display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;padding-block:18px;border-top:2px dashed var(--grid)}
.part .n{font-family:var(--f-marker);font-size:34px;color:var(--pen);line-height:1}
.part h3{font-family:var(--f-hand);font-weight:700;font-size:38px;line-height:1}
.part p{margin:8px 0 0;max-width:62ch}
.part .where{color:var(--pencil);font-size:15.5px}
.part .keys2{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px;font-family:var(--f-hand);font-size:24px;color:var(--pen);line-height:1.2}

/* Final */
.final{display:grid;gap:22px;padding-block:10px}
.result{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:center}
.result .horca{width:100%}
.result h2{font-family:var(--f-marker);font-size:clamp(46px,9vw,88px);line-height:.95}
.result h2.win{color:var(--green)} .result h2.lose{color:var(--red)}
.result .sum{font-family:var(--f-hand);font-weight:700;font-size:32px;line-height:1.1;margin-top:12px}
.result p{margin:10px 0 0;max-width:48ch;font-size:18px}
.podium{display:grid;gap:10px;margin-top:14px}
.podium div{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-family:var(--f-hand);font-weight:700;font-size:30px;line-height:1}
.podium div svg{width:36px;height:44px;flex:none}
.podium div span{flex:1 1 150px;min-width:0}
.result .podium .horca{width:36px;max-width:36px}
.podium div em{font-style:normal;font-family:var(--f-marker);font-size:20px;color:var(--pen);margin-left:auto;white-space:nowrap}
.podium div.out{opacity:.55}
.bars{display:grid;gap:10px}
.bars h3{font-family:var(--f-hand);font-weight:700;font-size:30px}
.bk{display:grid;grid-template-columns:170px minmax(0,1fr) 54px;gap:12px;align-items:center;font-family:var(--f-hand);font-weight:700;font-size:24px;line-height:1}
.bk .track{height:18px;border-bottom:2px solid var(--pencil);position:relative}
.bk .track i{position:absolute;left:0;bottom:2px;height:14px;background:var(--c);border-radius:2px 8px 3px 6px}
.bk .v{text-align:right;font-variant-numeric:tabular-nums}

/* Ahorcado dibujado */
.horca path,.horca circle,.horca line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.horca .wood{stroke:var(--pencil);stroke-width:6;filter:url(#rough)}
.horca .wood2{stroke:var(--pencil);stroke-width:1.6;opacity:.45;filter:url(#rough)}
.horca .guy{stroke:var(--ink);stroke-width:5.5;filter:url(#rough)}
.horca.dead .guy{stroke:var(--red)}
.horca.saved .guy{stroke:var(--green)}
.horca .face{stroke-width:3}
.horca .eye{fill:currentColor;stroke:none}
.horca .guy{color:var(--ink)} .horca.dead .guy{color:var(--red)} .horca.saved .guy{color:var(--green)}
.horca .ground{stroke:var(--grid);stroke-width:3}
.horca .draw{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .55s cubic-bezier(.22,1,.36,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.horca .pop{animation:pop .4s cubic-bezier(.22,1,.36,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.horca .pop{transform-box:fill-box;transform-origin:center}

#confeti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}

@media (max-width:760px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-art{max-width:300px;justify-self:center}
  .modes{grid-template-columns:minmax(0,1fr)}
  .stage{grid-template-columns:minmax(0,1fr);gap:16px}
  .side{order:-1;position:static;grid-template-columns:120px auto;align-items:center;justify-content:center;column-gap:16px}
  .side .horca{max-width:96px}
  .side{grid-template-columns:96px auto}
  .score{font-size:19px;padding:0 10px 0 2px}
  .score svg{width:24px;height:30px}
  .turnline{font-size:26px}
  .result{grid-template-columns:minmax(0,1fr)}
  .result .horca{max-width:190px}
  .bk{grid-template-columns:120px minmax(0,1fr) 46px;font-size:21px}
  .tilt-l,.tilt-r{transform:none}
}
.cita{font-style:italic;text-decoration:underline dotted var(--pen);text-decoration-thickness:2px;text-underline-offset:5px}
.bonus{margin-top:14px;padding-top:12px;border-top:2px dashed var(--grid);display:grid;gap:10px}
.bonus h4{margin:0;font-family:var(--f-hand);font-weight:700;font-size:28px;line-height:1.05;color:var(--pen)}
.bonus .row2{display:flex;flex-wrap:wrap;gap:10px}
.bonus .bq{font-family:var(--f-hand);font-weight:700;font-size:24px;line-height:1;padding:8px 16px 10px;border:2px solid var(--pen);background:var(--sheet);color:var(--pen);border-radius:30px}
.bonus .bq.right{border-color:var(--green);color:var(--green)} .bonus .bq.wrong{border-color:var(--red);color:var(--red);text-decoration:line-through}
.bonus .bq:disabled{cursor:default}
.bonus p{margin:0}
.repaso{display:grid;gap:4px}
.repaso h3{font-family:var(--f-hand);font-weight:700;font-size:30px}
.repaso article{padding-block:12px;border-top:2px dashed var(--grid);display:grid;gap:6px}
.repaso blockquote{margin:0;font-size:18px;line-height:1.5}
.repaso .meta{font-family:var(--f-hand);font-weight:700;font-size:22px;line-height:1.1}
.repaso .meta s{color:var(--red)} .repaso .meta b{color:var(--green)}

<script>
const PARTES = {
  intro:  {nombre:"Introducción", c:"--hl-intro", def:"Presenta el tema y despierta el interés del lector. Da contexto: de qué se va a hablar y por qué importa.", donde:"Al comienzo del ensayo.", claves:["Hoy en día…","En la actualidad…","Cada vez más…","Una pregunta, un dato o una situación cotidiana"]},
  tesis:  {nombre:"Tesis", c:"--hl-tesis", def:"Es la postura u opinión del autor sobre el tema. Todo el ensayo existe para defenderla, por eso debe ser clara y discutible.", donde:"Normalmente al final de la introducción.", claves:["Considero que…","En mi opinión…","Sostengo que…","Mi postura es…"]},
  arg:    {nombre:"Argumento", c:"--hl-arg", def:"Razones, ejemplos, datos, comparaciones o citas de una autoridad que apoyan la tesis. Forman el desarrollo o cuerpo del ensayo.", donde:"En el desarrollo, uno o varios párrafos.", claves:["En primer lugar…","Además…","Por ejemplo…","Según un estudio…"]},
  contra: {nombre:"Contraargumento", c:"--hl-contra", def:"Presenta una opinión contraria a la tesis y luego la refuta, mostrando por qué no es suficiente. Hace el ensayo más convincente.", donde:"En el desarrollo, casi siempre antes de la conclusión.", claves:["Algunos piensan que…","Es cierto que…","Sin embargo…","No obstante…"]},
  concl:  {nombre:"Conclusión", c:"--hl-concl", def:"Cierra el ensayo: retoma la tesis, resume las ideas principales y puede dejar una reflexión o propuesta.", donde:"Al final del ensayo.", claves:["En conclusión…","En resumen…","Por todo lo anterior…","En definitiva…"]}
};
PARTES.pon = {nombre:"Ponencia", c:"--hl-pon", def:"Exposición oral preparada en la que un ponente presenta un tema ante un público."};
const ORDEN_PARTES = ["intro","tesis","arg","contra","concl"];

/* Recortes "sin pistas": no traen conectores típicos, hay que reconocer qué hace el párrafo */
const SIN_PISTAS = [
  ["El celular en clase","tesis","El celular no debería estar prohibido en clase; lo que hace falta son reglas claras sobre cuándo y para qué se usa.","No dice «en mi opinión», pero es la postura que el resto del ensayo va a defender: es la tesis."],
  ["El celular en clase","concl","Al final, la pregunta no es si el celular entra al salón, sino si aprendemos a usarlo con responsabilidad.","Retoma la postura del autor y deja una reflexión para cerrar, aunque no empiece con «En conclusión»."],
  ["Reciclaje en el colegio","arg","Una botella de plástico tarda cientos de años en descomponerse; reciclada, en cambio, puede convertirse en una camiseta o en una silla.","Trae un hecho que apoya la idea de reciclar. No tiene «además» ni «por ejemplo», pero cumple la función de un argumento."],
  ["Reciclaje en el colegio","contra","¿Y si reciclar le quita tiempo a las clases? La experiencia de otros colegios muestra que cinco minutos por curso bastan.","Plantea la objeción de quien no está de acuerdo, en forma de pregunta, y luego la responde: es un contraargumento."],
  ["Leer por gusto","intro","En la biblioteca del colegio hay libros que nadie ha pedido prestados en años.","Abre el tema con una situación concreta y todavía no da ninguna opinión: es la introducción."],
  ["Leer por gusto","concl","Un libro no compite con una pantalla: nos da algo que ella no puede darnos, tiempo para pensar por nuestra cuenta. Vale la pena hacerle un espacio.","Cierra con una reflexión y una invitación a leer, retomando la postura del autor: es la conclusión."],
  ["Más educación física","arg","Los estudiantes que hacen deporte con regularidad duermen mejor y llegan más descansados a clase.","Da una razón a favor de más educación física: es un argumento, aunque no tenga conector."],
  ["Más educación física","intro","Suena el timbre del descanso y la mitad del curso se queda sentada mirando el celular.","Pinta una escena cotidiana para presentar el problema. El autor aún no opina: es la introducción."],
  ["Las redes sociales","contra","Prohibir las redes a los menores parece una solución sencilla. El problema es que lo prohibido se usa a escondidas y sin nadie que oriente.","Presenta la postura contraria (prohibirlas) y muestra por qué no basta: es un contraargumento."],
  ["El uniforme escolar","arg","Con uniforme, nadie llega al salón preguntándose si su ropa es lo bastante buena para que no se burlen.","Muestra un beneficio del uniforme que apoya la tesis: es un argumento."],
  ["El uniforme escolar","intro","Cada enero, en las tiendas del centro se forman filas de familias que compran sacos, jardineras y zapatos negros.","Describe una escena para presentar el tema y todavía no hay opinión: es la introducción."],
  ["Los videojuegos","tesis","Los videojuegos, jugados con medida, pueden enseñar tanto como muchas actividades que los adultos sí aprueban.","Es la idea que el autor va a defender, sin «considero que»: es la tesis."],
  ["Las tareas para la casa","concl","Menos tareas no significa estudiar menos: significa estudiar mejor y llegar al día siguiente con ganas de aprender.","Resume la postura del ensayo en una frase final que deja una idea para recordar: es la conclusión."],
  ["Comida sana en el colegio","arg","Un estudiante que almuerza fruta, arroz y proteína se concentra mejor en la tarde que uno que solo come paquetes y gaseosa.","Compara dos casos para apoyar la tesis de la comida sana: es un argumento."],
  ["Aprender otro idioma","contra","Hoy cualquier celular traduce en segundos, ¿para qué estudiar inglés entonces? Porque una aplicación no puede hacer amigos ni entender un chiste por nosotros.","Pone en boca de otros una objeción (el traductor) y la responde: es un contraargumento."],
  ["La música en el colegio","tesis","La clase de música merece tantas horas como la de matemáticas.","Es una opinión discutible que el ensayo va a defender: es la tesis, aunque no diga «a mi juicio»."]
];

/* ---------- Tema extra: la ponencia (preguntas de opción múltiple; la primera opción es la correcta) ---------- */
const PONENCIA = [
  ["¿Qué es una ponencia?", ["Una exposición oral preparada sobre un tema ante un público","Una discusión entre dos equipos que defienden posturas opuestas","Una conversación en la que un periodista entrevista a un experto","Una reunión en la que varias personas opinan libremente de un tema"], "La ponencia es una exposición preparada: el ponente presenta un tema ante un público. En un debate se enfrentan posturas y en una entrevista mandan las preguntas."],
  ["¿Cómo se llama la persona que presenta una ponencia?", ["El ponente","El moderador","El relator","El auditorio"], "Quien expone es el ponente. El moderador organiza, el relator toma nota de lo que se dijo y el auditorio es el público."],
  ["En un foro o congreso, ¿qué hace el moderador?", ["Presenta a los ponentes, controla el tiempo y organiza las preguntas","Expone el tema principal del evento antes que los demás ponentes","Resume por escrito lo que dijo cada ponente cuando todo termina","Responde las preguntas del público en lugar de los ponentes"], "El moderador dirige el evento: presenta, cuida el tiempo y da la palabra al público. Quien escribe el resumen es el relator."],
  ["¿Cuál es el orden de las partes de una ponencia?", ["Introducción, desarrollo, conclusión y preguntas","Desarrollo, introducción, preguntas y conclusión","Introducción, preguntas, desarrollo y conclusión","Preguntas, introducción, conclusión y desarrollo"], "Empieza con la introducción, sigue el desarrollo, cierra con la conclusión y al final se abre la ronda de preguntas."],
  ["¿Qué se hace en la introducción de una ponencia?", ["Saludar, presentar el tema y decir el objetivo","Explicar los datos más importantes de la investigación","Resumir las ideas principales y agradecer al público","Contar de qué fuentes salió la información usada"], "La introducción saluda, presenta el tema y anuncia qué se va a explicar y para qué. Los datos van en el desarrollo y el resumen en la conclusión."],
  ["«Buenos días. Hoy les voy a hablar del reciclaje en el colegio y de por qué deberíamos empezar ya.» ¿A qué parte de la ponencia corresponde lo anterior?", ["Introducción","Desarrollo","Conclusión","Ronda de preguntas"], "Saluda y presenta el tema y el objetivo: es la introducción."],
  ["«Según una encuesta que hicimos en nuestro curso, cada estudiante bota casi un kilo de basura a la semana, como muestra esta gráfica.» ¿A qué parte de la ponencia corresponde lo anterior?", ["Desarrollo","Introducción","Conclusión","Ronda de preguntas"], "Da un dato, dice de dónde salió y usa un apoyo visual: es el desarrollo."],
  ["«Para cerrar, recordemos las tres ideas principales. Muchas gracias por su atención.» ¿A qué parte de la ponencia corresponde lo anterior?", ["Conclusión","Introducción","Desarrollo","Ronda de preguntas"], "Resume las ideas y agradece: es la conclusión."],
  ["«¿Alguien tiene alguna pregunta o comentario?» ¿En qué momento de la ponencia se dice lo anterior?", ["En la ronda de preguntas","En el saludo inicial","En medio del desarrollo","Justo antes de la conclusión"], "Después de la conclusión se abre un espacio para que el público pregunte."],
  ["¿En qué parte de la ponencia se explican las ideas con datos y ejemplos?", ["En el desarrollo","En la introducción","En la conclusión","En la ronda de preguntas"], "El desarrollo es el cuerpo: ahí van las ideas, los datos, los ejemplos y las fuentes."],
  ["En una ponencia, ¿quién es el público?", ["Las personas que asisten a escuchar la exposición","Los ponentes que hablan después en el mismo evento","El comité que organiza el evento y elige los temas","Los invitados que comentan la ponencia en un panel"], "El público son quienes escuchan. Al final pueden hacer preguntas."],
  ["¿Qué es un simposio?", ["Una reunión en la que varios expertos exponen sobre un mismo tema","Una discusión en la que dos grupos defienden posturas contrarias","Una conversación informal entre especialistas, sin orden fijo","Una clase en la que un solo profesor explica un tema muy largo"], "En un simposio, varios ponentes exponen por turnos sobre un mismo tema ante un público."],
  ["¿Cuál es el primer paso para preparar una ponencia?", ["Elegir y delimitar el tema","Diseñar las diapositivas","Escribir el guion completo","Ensayar frente a los amigos"], "Primero se elige y delimita el tema; después se investiga, se hace el guion, se preparan los apoyos y se ensaya."],
  ["¿Para qué sirve un guion o esquema en una ponencia?", ["Para ordenar las ideas clave y no perder el hilo","Para leerlo completo y no equivocarse al hablar","Para entregárselo al moderador antes de empezar","Para memorizar cada frase exactamente igual"], "El guion es una guía con las ideas clave. Se mira de vez en cuando; si se lee completo, el ponente deja de mirar al público."],
  ["¿Cómo deben ser las diapositivas de una ponencia?", ["Con pocas palabras, letra grande e imágenes","Con el texto completo de lo que vas a decir","Con muchas animaciones para que no se aburran","Con todos los datos que encontraste al investigar"], "Las diapositivas apoyan al ponente; no lo reemplazan. Si tienen mucho texto, el público lee en vez de escuchar."],
  ["¿Por qué conviene ensayar la ponencia antes?", ["Para medir el tiempo y ganar seguridad","Para memorizar el texto palabra por palabra","Para que las diapositivas queden más bonitas","Para saber de antemano qué van a preguntar"], "Ensayar en voz alta ayuda a medir el tiempo y a sentirse seguro. Memorizar todo hace que suene recitado."],
  ["¿Para qué sirve el contacto visual en una ponencia?", ["Para mantener la atención y mostrar seguridad","Para no tener que mirar el guion en ningún momento","Para saber quién va a hacer preguntas al final","Para poder hablar más rápido sin perderse"], "Mirar a distintas personas del público las mantiene atentas y muestra confianza."],
  ["¿Qué es una muletilla?", ["Una palabra que se repite sin necesidad, como «eh»","Una frase corta que resume la idea principal","Una pausa en silencio para que el público piense","Una palabra técnica que el público no conoce"], "Las muletillas («eh», «o sea», «este») distraen. Una pausa en silencio, en cambio, ayuda."],
  ["¿Cómo debe usar la voz el ponente?", ["Clara, con buen volumen y ritmo pausado","Rápida, para alcanzar a decir toda la información","Fuerte y siempre en el mismo tono para sonar seguro","Suave, como en una conversación entre amigos"], "Volumen, claridad, ritmo pausado y cambios de tono hacen que el público entienda y no se aburra."],
  ["¿Qué postura conviene durante una ponencia?", ["Erguida y tranquila, con las manos acompañando","Quieta detrás de la mesa, con las manos juntas","Mirando la pantalla para seguir las diapositivas","Caminando todo el tiempo para mostrar energía"], "La postura también comunica: abierta, tranquila y de frente al público transmite seguridad."],
  ["Si en tu ponencia usas una idea o un dato de otra persona, ¿qué debes hacer?", ["Decir de quién es: «Según…»","Ponerla en la diapositiva sin nombrarla","Decirla con tus palabras sin nombrar al autor","Nombrar la fuente solo si alguien lo pregunta"], "En voz alta se nombra la fuente, así el público sabe que la idea es de otra persona. Decirla con otras palabras no la vuelve tuya."],
  ["Alguien del público te hace una pregunta que no sabes responder. ¿Qué haces?", ["Reconocer que no lo sabes y ofrecer averiguarlo","Responder algo parecido aunque no sea exacto","Pedirle al moderador que pase a otra pregunta","Decir que eso no hacía parte de tu tema"], "Reconocer con respeto que no se sabe algo, y ofrecer averiguarlo, da más credibilidad que improvisar una respuesta."],
  ["¿Qué debes hacer con el tiempo que te dan para la ponencia?", ["Respetarlo y repartirlo entre las partes","Usarlo casi todo en el desarrollo","Terminar antes para dejar más preguntas","Extenderlo si el público está interesado"], "Respetar el tiempo es respetar al público y a los demás ponentes. Cada parte necesita su espacio."],
  ["¿Dónde se suelen presentar ponencias?", ["En congresos, foros y simposios","En debates y mesas redondas","En entrevistas y conversatorios","En noticieros y programas de radio"], "La ponencia es típica de eventos académicos como congresos, foros y simposios, aunque en clase también se hacen."],

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const cvar = k => `--c:var(${PARTES[k].c})`;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Sonido: música y efectos con Web Audio ---------- */
const Sonido = (() => {
  const leer = (k,d) => { try { const v = localStorage.getItem(k); return v === null ? d : v === "1"; } catch { return d; } };
  const guardar = (k,v) => { try { localStorage.setItem(k, v ? "1" : "0"); } catch {} };
  const st = { musica: leer("cz-musica", true), efectos: leer("cz-efectos", true) };
  let alCambiar = () => {};
  let ctx = null, master, mus, sfx, ruidoBuf, reloj = null, paso = 0, prox = 0;
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  function init(){
    if (ctx) { if (ctx.state !== "running") ctx.resume(); if (st.musica) arrancar(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = .85;
    const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
    mus = ctx.createGain(); mus.gain.value = 0;
    const suave = ctx.createBiquadFilter(); suave.type = "lowpass"; suave.frequency.value = 2200; mus.connect(suave); suave.connect(master);
    sfx = ctx.createGain(); sfx.gain.value = st.efectos ? .7 : 0; sfx.connect(master);
    ruidoBuf = ctx.createBuffer(1, ctx.sampleRate * .6, ctx.sampleRate);
    const d = ruidoBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    // Cuando el navegador por fin deja sonar el audio, reprograma la música desde "ahora"
    ctx.onstatechange = () => {
      if (ctx.state !== "running") return;
      if (st.musica) { if (reloj) { prox = ctx.currentTime + .05; mus.gain.cancelScheduledValues(ctx.currentTime); mus.gain.setTargetAtTime(VOL_MUSICA, ctx.currentTime, 1.2); } else arrancar(); }
      alCambiar();
    };
    if (ctx.state !== "running") ctx.resume();
    if (st.musica) arrancar();
  }
  function tono(m, t, dur, {tipo="triangle", vol=.2, dest=sfx, ataque=.006, slide=0}={}){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = tipo; o.frequency.setValueAtTime(hz(m), t);
    if (slide) o.frequency.exponentialRampToValueAtTime(hz(m + slide), t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + ataque); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + .03);
  }
  function ruido(t, dur, {vol=.1, freq=6000, q=.8, tipo="highpass", dest=sfx}={}){
    const s = ctx.createBufferSource(); s.buffer = ruidoBuf;
    const f = ctx.createBiquadFilter(); f.type = tipo; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random()*.3); s.stop(t + dur + .03);
  }

  // Canción alegre en Do mayor: Do – Sol – La menor – Fa, ritmo de ukelele
  const VOL_MUSICA = .3; // música de fondo suave, por debajo de los efectos
  const OCT = 60 / 116 / 2;
  const ACORDES = [[60,64,67],[55,59,62],[57,60,64],[53,57,60]];
  const MEL = [
    72,0,76,0,79,76,74,72,  74,0,71,0,67,0,71,74,  72,0,69,0,72,76,0,74,  72,0,69,0,65,0,67,0,
    76,0,79,0,84,0,79,76,   74,76,74,71,67,0,0,0,  69,72,76,0,74,72,69,0, 65,67,69,71,72,0,0,0 ];
  function tocar(s, t){
    const compas = Math.floor(s / 8), b = s % 8, ch = ACORDES[compas % 4];
    const m = MEL[s % MEL.length];
    if (m) { tono(m, t, OCT*1.7, {tipo:"triangle", vol:.07, dest:mus}); tono(m+12, t, OCT*1.1, {tipo:"sine", vol:.02, dest:mus}); }
    if (b === 0 || b === 4) tono(ch[0]-24, t, OCT*1.9, {tipo:"triangle", vol:.26, dest:mus});
    if (b === 6) tono(ch[2]-24, t, OCT*1.2, {tipo:"triangle", vol:.18, dest:mus});
    if (b % 2 === 1) ch.forEach((n,i) => tono(n, t + i*.012, OCT*.9, {tipo:"triangle", vol:.04, dest:mus, ataque:.003}));
    if (b === 2 || b === 6) ruido(t, .1, {vol:.11, freq:1700, tipo:"bandpass", q:.7, dest:mus});
    ruido(t, .035, {vol: b % 2 ? .045 : .025, freq:8000, dest:mus});
  }
  function programar(){ while (prox < ctx.currentTime + .18) { tocar(paso, prox); paso++; prox += OCT; } }
  let sonoAntes = false;
  setInterval(() => { sonoAntes = !!ctx && ctx.state === "running" && !!reloj; }, 300);
  function arrancar(){
    if (!ctx || reloj) return;
    paso = 0; prox = ctx.currentTime + .1;
    mus.gain.cancelScheduledValues(ctx.currentTime); mus.gain.setTargetAtTime(VOL_MUSICA, ctx.currentTime, 1.2);
    reloj = setInterval(programar, 40);
  }
  function parar(){ if (!reloj) return; clearInterval(reloj); reloj = null; mus.gain.setTargetAtTime(0, ctx.currentTime, .08); }
  function bajar(seg){ if (!ctx || !reloj) return; const t = ctx.currentTime; mus.gain.cancelScheduledValues(t); mus.gain.setTargetAtTime(VOL_MUSICA * .25, t, .05); mus.gain.setTargetAtTime(VOL_MUSICA, t + seg, .6); }
  document.addEventListener("visibilitychange", () => { if (!ctx) return; if (document.hidden) parar(); else if (st.musica) arrancar(); });

  const fx = fn => { if (!ctx || !st.efectos) return; fn(ctx.currentTime + .01); };
  return {
    onCambio(fn){ alCambiar = fn; },
    init, st, listo: () => !!ctx && ctx.state === "running",
    sonando: () => !!ctx && ctx.state === "running" && !!reloj && sonoAntes,
    musica(v){ st.musica = v; guardar("cz-musica", v); init(); if (!ctx) return; v ? arrancar() : parar(); },
    pausarMusica(){ st.musica = false; if (ctx) parar(); if (alCambiar) alCambiar(); },
    efectos(v){ st.efectos = v; guardar("cz-efectos", v); init(); if (sfx) sfx.gain.value = v ? .7 : 0; },
    acierto(){ fx(t => { [72,76,79,84].forEach((m,i) => tono(m, t+i*.07, .28, {tipo:"square", vol:.06})); tono(96, t+.28, .4, {vol:.05}); }); },
    error(){ fx(t => { tono(50, t, .38, {tipo:"sawtooth", vol:.07, slide:-8}); tono(57, t, .3, {tipo:"square", vol:.03, slide:-6}); }); },
    trazo(){ fx(t => { for (let i=0;i<5;i++) ruido(t + .12 + i*.07, .06, {vol:.16, freq:3600, tipo:"bandpass", q:1.4}); }); },
    tap(){ fx(t => tono(84, t, .07, {vol:.07})); },
    tic(){ fx(t => tono(93, t, .05, {tipo:"square", vol:.025})); },
    bajar,
    victoria(){ bajar(2.2); fx(t => { [[67,0],[72,.12],[76,.24],[79,.36],[76,.6],[79,.72],[84,.84]].forEach(([m,d]) => tono(m, t+d, d > .7 ? .9 : .22, {tipo:"square", vol:.06})); }); },
    derrota(){ bajar(2.6); fx(t => { [67,66,65].forEach((m,i) => tono(m, t+i*.38, .36, {tipo:"sawtooth", vol:.05})); tono(64, t+1.14, 1, {tipo:"sawtooth", vol:.05, slide:-1}); }); }
  };
})();
// Los navegadores solo dejan sonar audio después de un gesto del usuario: lo intentamos en cada toque hasta que suene
const desbloquear = () => { Sonido.init(); if (Sonido.listo()) ["pointerdown","click","touchend","keydown"].forEach(ev => document.removeEventListener(ev, desbloquear, true)); };
["pointerdown","click","touchend","keydown"].forEach(ev => document.addEventListener(ev, desbloquear, true));
function pintarToggles(){
  const bloqueada = Sonido.st.musica && !Sonido.listo();
  $("#tMusic").classList.toggle("wake", bloqueada);
  $("#tMusic .on").textContent = bloqueada ? "Activar música" : "Música";
  $("#tMusic").setAttribute("aria-pressed", Sonido.st.musica);
  $("#tSfx").setAttribute("aria-pressed", Sonido.st.efectos);
}
// Si la música aún no sonaba (primer toque), este clic la enciende en vez de apagarla
$("#tMusic").onclick = () => { Sonido.musica(Sonido.st.musica && !Sonido.sonando() ? true : !Sonido.st.musica); pintarToggles(); };
$("#tSfx").onclick = () => { Sonido.efectos(!Sonido.st.efectos); pintarToggles(); };
Sonido.onCambio(pintarToggles);
pintarToggles();

/* ---------- El ahorcado dibujado ---------- */
const MAX_FALLOS = 6;
const CUERPO = [
  `<circle cx="140" cy="72" r="20" pathLength="100"/>`,
  `<path d="M140 92 Q138 122 141 152" pathLength="100"/>`,
  `<path d="M140 108 Q126 118 111 134" pathLength="100"/>`,
  `<path d="M140 108 Q154 117 169 132" pathLength="100"/>`,
  `<path d="M141 152 Q128 172 117 195" pathLength="100"/>`,
  `<path d="M141 152 Q153 172 165 194" pathLength="100"/>`
];
function cara(err, estado){
  if (estado === "salvado") return `<g class="face pop"><circle class="eye" cx="133" cy="68" r="2.6"/><circle class="eye" cx="147" cy="68" r="2.6"/><path d="M130 77 Q140 90 150 77"/></g>`;
  if (estado === "muerto") return `<g class="face pop"><path d="M129 64 L136 71 M136 64 L129 71 M144 64 L151 71 M151 64 L144 71"/><path d="M132 84 Q140 77 148 84"/></g>`;
  const boca = err <= 2 ? `M132 79 Q140 86 148 79` : err <= 4 ? `M133 82 Q140 81 147 82` : `M132 84 Q140 77 148 84`;
  const cejas = err >= 4 ? `<path d="M128 61 L136 64 M152 61 L144 64"/>` : "";
  const gota = err >= 5 ? `<path d="M158 60 Q161 66 158 68 Q155 66 158 60" style="fill:var(--pen);stroke:var(--pen);stroke-width:1.5"/>` : "";
  return `<g class="face"><circle class="eye" cx="133" cy="69" r="2.4"/><circle class="eye" cx="147" cy="69" r="2.4"/><path d="${boca}"/>${cejas}${gota}</g>`;
}
function horca(err, {animar=false, estado="jugando", mini=false}={}){
  const salvado = estado === "salvado", muerto = estado === "muerto" || err >= MAX_FALLOS;
  let fig = "";
  if (salvado) {
    fig = `<g transform="translate(0 31)">${CUERPO[0]}${CUERPO[1]}<path d="M140 108 Q126 96 113 82"/><path d="M140 108 Q154 96 167 82"/>${CUERPO[4]}${CUERPO[5]}${cara(0,"salvado")}</g>`;
  } else {
    fig = CUERPO.slice(0, err).map((p,i) => (animar && i === err-1) ? p.replace("/>", ` class="draw"/>`) : p).join("");
    if (err >= 1 && !mini) fig += cara(err, muerto ? "muerto" : "jugando");
  }
  const cuerda = salvado ? `<path d="M140 20 Q143 28 140 36 M140 36 L136 41 M140 36 L144 40"/>` : `<path d="M140 20 Q143 36 140 52"/>`;
  return `<svg class="horca ${mini?"mini":""} ${muerto?"dead":""} ${salvado?"saved":""}" viewBox="0 0 200 240" role="img" aria-label="${salvado ? "Ahorcado salvado" : `Ahorcado: ${err} de ${MAX_FALLOS} fallos`}">
    <path class="ground" d="M6 229 Q100 233 194 228"/>
    <g class="wood"><path d="M14 226 Q80 222 156 227"/><path d="M50 228 Q47 120 52 18"/><path d="M46 22 Q100 17 144 21"/><path d="M50 58 Q66 40 86 20"/>${cuerda}</g>
    ${mini ? "" : `<g class="wood2"><path d="M56 226 Q54 130 57 26"/><path d="M52 27 Q100 23 136 26"/></g>`}
    <g class="guy">${fig}</g></svg>`;
}
function vidasHTML(err){
  const muerto = err >= MAX_FALLOS;
  const marcas = "/".repeat(err);
  return `<div class="lives ${muerto?"dead":""}">${muerto ? "¡Ahorcado!" : err === 0 ? "Sin fallos" : `Fallos: ${err} de ${MAX_FALLOS}`}<span class="tally">${marcas}</span></div>`;
}

/* ---------- Confeti de papelitos ---------- */
function confeti(){
  if (reduce) return;
  const cv = $("#confeti"), g = cv.getContext("2d");
  cv.hidden = false; cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#FFE45E","#FF9DCB","#86E0A3","#FFB867","#9BCFFF"];
  const ps = Array.from({length:110}, () => ({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*.4, w:6+Math.random()*8, h:4+Math.random()*6,
    vy:2+Math.random()*3, vx:-1.5+Math.random()*3, r:Math.random()*6, vr:-.15+Math.random()*.3, c:cols[Math.floor(Math.random()*5)]}));
  const t0 = performance.now();
  (function frame(t){
    g.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.w/2,-p.h/2,p.w,p.h); g.restore(); });
    if (t - t0 < 3200) requestAnimationFrame(frame); else { g.clearRect(0,0,cv.width,cv.height); cv.hidden = true; }
  })(t0);
}


/* ---------- Palabras clave para las pistas ---------- */
const CLAVES = {
  intro:["Hoy","Cada día","Cada año","Vivimos","Muchos estudiantes","Muchos adolescentes","Al terminar","En los descansos"],
  tesis:["En mi opinión","Considero que","considero que","Pienso que","Sostengo que","defiendo que","A mi juicio","Mi postura es"],
  arg:["Por ejemplo","Además","En primer lugar","En segundo lugar","Asimismo","También","Diversos estudios señalan","Según diversas investigaciones","Por un lado","Por otro lado","Como dice","Como escribió","Se atribuye"],
  contra:["Es cierto que","Es verdad que","Sin embargo","No obstante","Aun así","Pero","pero","Hay quienes","Algunas personas","algunos piensan","Algunos profesores piensan","Algunos adultos sostienen","Quienes están en contra","Quienes no están de acuerdo","Se podría objetar","Se podría pensar"],
  concl:["En conclusión","En resumen","En definitiva","Por todo lo anterior","Por estas razones","Así,"]
};
function marcarClaves(t, k){
  let h = esc(t);
  (CLAVES[k] || []).forEach(c => { const e = esc(c); const re = new RegExp("(^|[\\s¿¡(])(" + e.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "g"); h = h.replace(re, (m, a, b) => a + "\u0001" + b + "\u0002"); });
  return h.replace(/\u0001/g, '<span class="clave">').replace(/\u0002/g, "</span>");
}

/* ---------- Código QR para entrar desde el celular ---------- */
const URL_JUEGO = /github\.io$/.test(location.hostname) ? location.origin + location.pathname : "https://christian140921.github.io/cazadores-del-ensayo/";
function pintarQR(el, tam, texto = URL_JUEGO){
  if (!el) return;
  if (typeof QRCode === "undefined") { el.hidden = true; return; }
  el.innerHTML = "";
  new QRCode(el, { text: texto, width: tam, height: tam, colorDark: "#1D2740", colorLight: "#FFFFFF", correctLevel: QRCode.CorrectLevel.M });
}
function qrGrande(){
  const d = document.createElement("div");
  d.className = "qr-big"; d.setAttribute("role", "dialog"); d.setAttribute("aria-label", "Código QR del juego");
  d.innerHTML = `<h2>Escanea y juega</h2><div class="qr" id="qrBig"></div><div class="qr-url">${esc(URL_JUEGO.replace(/^https:\/\//, ""))}</div><button class="btn go" id="qrClose">Cerrar</button>`;
  document.body.appendChild(d);
  pintarQR($("#qrBig"), 460);
  const cerrar = () => { d.remove(); document.removeEventListener("keydown", esc_); };
  const esc_ = e => { if (e.key === "Escape") cerrar(); };
  $("#qrClose").onclick = cerrar; $("#qrClose").focus();
  document.addEventListener("keydown", esc_);
}

/* ---------- Récords guardados en este dispositivo ---------- */
const leerRecords = () => { try { return JSON.parse(localStorage.getItem("cz-records") || "[]"); } catch { return []; } };
function guardarRecord(r){
  const lista = leerRecords().concat(r).sort((a,b) => b.pts - a.pts || b.ok - a.ok).slice(0, 10);
  try { localStorage.setItem("cz-records", JSON.stringify(lista)); } catch {}
  return lista;
}
function recordsHTML(lista, yo){
  if (!lista.length) return `<p style="margin:0;color:var(--soft)">Todavía no hay récords. ¡El primero puede ser el tuyo!</p>`;
  return `<ol>${lista.slice(0,5).map((r,i)=>`<li class="${yo && r.id===yo ? "me" : ""}"><span class="pos">${i+1}.</span><span>${esc(r.nombre)}</span><span class="p">${r.pts} pts · ${r.ok}/${r.n}</span></li>`).join("")}</ol>`;
}

  return `<div class="bonus" id="bonus"><h4>Bonus +5: ¿para qué usa el autor las palabras entre comillas?</h4>
    <div class="row2">${shuffle(USOS_CITA.slice()).map(([v,t]) => `<button class="bq" data-v="${v}">${esc(t)}</button>`).join("")}</div><div id="bonusFb"></div></div>`;

function responderBonus(q, b){
  if (S.bonusListo) return;
  S.bonusListo = true;
  const correcta = q.k === "contra" ? "contra" : "apoyo", ok = b.dataset.v === correcta, eq = S.equipos[S.turno];
  document.querySelectorAll(".bq").forEach(x => { x.disabled = true; if (x.dataset.v === correcta) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); });
  if (ok) { eq.pts += 5; Sonido.acierto(); } else Sonido.error();
  const uso = correcta === "contra" ? "mostrar lo que piensan quienes no están de acuerdo y después responderles" : "respaldar su tesis con la voz de alguien más";
  $("#bonusFb").innerHTML = `<p>${ok ? "<b>¡Bien! +5.</b> " : "<b>No.</b> "}Las comillas indican que esas palabras son de ${esc(q.c)}, no del autor. Aquí las usa para ${uso}.</p>`;
  $("#scores").innerHTML = scoresHTML();
  publicarVivo();
}

/* ---------- Clasifica ---------- */
const POOL = [];
ENSAYOS.forEach(e => e.f.forEach(([k,t,w,c]) => POOL.push({k,t,w,c,tema:e.tema})));
// Si empieza con «…», el fragmento va en la hoja y lo demás es la pregunta de abajo
SIN_PISTAS.forEach(([tema,k,t,w]) => POOL.push({k,t,w,tema,dif:true}));
PONENCIA.forEach(([t,ops,w]) => { const m = t.match(/^«(.+)» (.+)$/); POOL.push({k:"pon", t: m ? m[1] : t, pq: m ? m[2] : "", ops, ok:0, w, tema:"La ponencia"}); });
// Arma una partida como lista de posiciones en POOL, para poder compartirla en vivo
function armarCola(n){
  const pon = shuffle(POOL.map((_, i) => i).filter(i => POOL[i].k === "pon"));
  return cfg.tema === "ponencia" ? pon.slice(0, n) : colaEnsayo(n);
}
function colaEnsayo(n){
  if (n <= 0) return [];
  // Al azar, sin vueltas fijas: nunca dos de la misma parte seguidas y sin abusar de una sola parte
  const idx = shuffle(POOL.map((_, i) => i).filter(i => POOL[i].k !== "pon"));
  const maxParte = Math.ceil(n / 5) + 1, maxDif = n <= 5 ? 1 : n <= 10 ? 3 : n;
  const cuenta = {}, cola = []; let dif = 0;
  for (let estricto = 1; estricto >= 0 && cola.length < n; estricto--)
    for (const i of idx) {
      if (cola.length >= n) break;
      const q = POOL[i];
      if (cola.includes(i) || (cola.length && POOL[cola[cola.length - 1]].k === q.k)) continue;
      if (estricto && ((cuenta[q.k] || 0) >= maxParte || (q.dif && dif >= maxDif))) continue;
      cola.push(i); cuenta[q.k] = (cuenta[q.k] || 0) + 1; if (q.dif) dif++;
    }
  // Que aparezca al menos una cita entre comillas (reemplaza un recorte de la misma parte)
  if (!cola.some(i => POOL[i].c)) {
    const citas = idx.filter(i => POOL[i].c);
    let j = cola.findIndex(i => ["arg","contra"].includes(POOL[i].k)), cita;
    if (j >= 0) cita = citas.find(i => POOL[i].k === POOL[cola[j]].k);
    else for (j = 0; j < cola.length && cita === undefined; j++) {
      const vec = [cola[j - 1], cola[j + 1]].filter(x => x !== undefined).map(x => POOL[x].k);
      cita = citas.find(i => !vec.includes(POOL[i].k));
      if (cita !== undefined) j--;
    }
    if (cita !== undefined && j >= 0 && j < cola.length) cola[j] = cita;
  }
  return cola;
}
// Huella del banco de preguntas: si el proyector y un celular tienen versiones distintas, los números de pregunta no coinciden
const VERSION_PREGUNTAS = (() => { let h = 0; const t = JSON.stringify([POOL.map(q => q.t), DIFICILES]); for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return (h >>> 0).toString(36); })();
function startClasifica(vivo){
  const enEquipos = !vivo && cfg.equipos;
  // Por equipos, la cantidad de recortes se ajusta a un múltiplo del número de equipos para que todos jueguen las mismas veces
  const n = enEquipos ? Math.max(cfg.nEquipos, Math.round(cfg.rondas / cfg.nEquipos) * cfg.nEquipos) : cfg.rondas;
  const cola = (vivo ? vivo.orden : armarCola(n)).map(i => POOL[i]);
  const equipos = enEquipos ? cfg.nombres.slice(0,cfg.nEquipos).map((nm,i)=>({nombre:(nm||"").trim()||`Equipo ${i+1}`, pts:0, ok:0, n:0, err:0, out:false, racha:0})) : [{nombre:(vivo ? vivo.nombre : cfg.jugador) || "Tú", pts:0, ok:0, n:0, err:0, out:false, racha:0}];
  S = { cola, i:0, equipos, turno:0, racha:0, respondido:false, fallos:[], vivo: vivo || null, stats:Object.fromEntries([...ORDEN_PARTES, "pon"].map(k=>[k,{ok:0,n:0}])) };
  // Volvió a entrar a una partida en curso: retoma su puntaje y sigue desde donde iba
  const prev = vivo && vivo.previo;
  if (prev) {
    Object.assign(equipos[0], { pts:prev.pts||0, ok:prev.ok||0, n:prev.n||0, err:prev.err||0, out:!!prev.out });
    S.ptsPublicados = prev.pts || 0;
    if (prev.terminado || prev.out || (prev.n||0) >= cola.length) { S.i = cola.length - 1; return final(); }
    S.i = prev.n || 0;
  }
  ronda();
}

}
function barra(){

  return `<svg viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 6 Q150 4 298 7" stroke="var(--grid)" stroke-width="5" fill="none" stroke-linecap="round"/>

}

const PREGUNTAS_ENSAYO = ["¿A qué parte del ensayo corresponde el fragmento anterior?","¿Lo anterior es una introducción, una tesis, un argumento, un contraargumento o una conclusión?","¿Qué parte del ensayo es el recorte anterior?"];
function ronda(){
  stopTimer();
  const q = S.cola[S.i], eq = S.equipos[S.turno];
  S.racha = eq.racha || 0;
  S.respondido = false;
  const esPon = q.k === "pon";
  const opts = esPon
    ? shuffle(q.ops.map((_, i) => i)).map((i,n)=>`<button class="ans" data-k="${i}" style="${cvar("pon")}"><span class="cap">${n+1}</span><span class="txt">${esc(q.ops[i])}</span></button>`).join("")
    : ORDEN_PARTES.map((k,n)=>`<button class="ans" data-k="${k}" style="${cvar(k)}"><span class="cap">${n+1}</span><span class="txt">${PARTES[k].nombre}</span></button>`).join("");
  app.innerHTML = `${hudHTML()}
    <div class="turnline">${cfg.equipos ? "Turno de" : "Juega"} <span class="hl" style="${cvar("intro")}">${esc(eq.nombre)}</span></div>
    <div class="stage">
      <div class="main">
        <div class="sheet clip"><div class="tema">${esPon ? `tema: <span class="hl" style="${cvar("pon")}">la ponencia</span>` : `del ensayo «${esc(q.tema)}»`}</div>
          <blockquote id="quote">${conCitas(esc(q.pq ? "«" + q.t + "»" : q.t))}</blockquote></div>
        <p class="pregunta">${esPon ? (q.pq ? esc(q.pq) : "Elige la respuesta correcta:") : PREGUNTAS_ENSAYO[S.i % PREGUNTAS_ENSAYO.length]}</p>
        <div class="answers ${esPon ? "pon" : ""}" id="answers">${opts}</div>
        <div class="tools-row"><button class="pista" id="pista"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Pista: quita 2 opciones (vale la mitad)</button></div>
      </div>
      <aside class="side" id="gallows">${horca(eq.err)}${vidasHTML(eq.err)}</aside>
    </div>
    <div id="fb"></div>
    <p class="keys">atajos: teclas 1 a ${esPon ? 4 : 5} para responder, P para la pista y Enter para seguir</p>`;
  $("#answers").addEventListener("click", e => { const b = e.target.closest(".ans"); if (b && !b.disabled) responder(b.dataset.k); });
  S.pista = false;
  $("#pista").onclick = usarPista;
  if (cfg.tiempo) {
    // El tiempo se calcula desde un límite fijo, así el reloj siempre baja de uno en uno aunque el navegador se atrase
    const limite = Date.now() + cfg.tiempo * 1000;
    S.restante = cfg.tiempo; pintarTimer();
    stopTimer();
    timer = setInterval(() => {
      const r = Math.max(0, Math.ceil((limite - Date.now()) / 1000));
      if (r === S.restante) return;
      S.restante = r; pintarTimer();
      if (r <= 5 && r > 0) Sonido.tic();
      if (r <= 0) { stopTimer(); responder(null); }
    }, 200);
  }
}
function pintarTimer(){ const t = $("#timer"); if (!t) return; t.textContent = S.restante + "s"; t.classList.toggle("low", S.restante <= 5); }

function usarPista(){
  if (!S || S.respondido || S.pista) return;
  S.pista = true; Sonido.tap();
  const q = S.cola[S.i];
  const correcta = q.k === "pon" ? String(q.ok) : q.k;
  shuffle([...document.querySelectorAll(".ans")].filter(b => b.dataset.k !== correcta)).slice(0, 2).forEach(b => { b.disabled = true; b.classList.add("out"); });
  if (q.k !== "pon") $("#quote").innerHTML = conCitas(marcarClaves(q.t, q.k));
  $("#pista").disabled = true;
}
const vivos = () => S.equipos.filter(e => !e.out);
const terminado = () => S.i >= S.cola.length - 1 || vivos().length === 0;

function responder(k){
  if (!S || S.respondido) return;
  S.respondido = true; stopTimer();
  const q = S.cola[S.i], esPon = q.k === "pon", correcta = esPon ? String(q.ok) : q.k, ok = k === correcta, eq = S.equipos[S.turno];
  eq.n++; S.stats[q.k].n++;
  let ganados = 0;
  if (ok) {
    eq.racha = (eq.racha || 0) + 1; S.racha = eq.racha; eq.ok++; S.stats[q.k].ok++;
    ganados = 10 + (cfg.tiempo ? Math.round(S.restante / cfg.tiempo * 5) : 0) + (S.racha >= 3 ? 5 : 0);
    if (S.pista) ganados = Math.ceil(ganados / 2);
    eq.pts += ganados;
    Sonido.acierto();
  } else {
    eq.racha = 0; S.racha = 0; eq.err++;
    S.fallos.push({ q, k, quien: eq.nombre });
    if (eq.err >= MAX_FALLOS) eq.out = true;
    $("#gallows").innerHTML = horca(eq.err, {animar:true}) + vidasHTML(eq.err);
    Sonido.error(); Sonido.trazo();
    if (eq.out) setTimeout(() => Sonido.derrota(), 450);
  }
  if ($("#pista")) $("#pista").disabled = true;
  document.querySelectorAll(".ans").forEach(b => {
    b.disabled = true; b.classList.remove("out");
    if (b.dataset.k === correcta) b.classList.add("right");
    else if (b.dataset.k === k) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const quote = $("#quote");
  quote.innerHTML = `<span class="hl sweep off" style="${cvar(q.k)}">${conCitas(esc(q.pq ? "«" + q.t + "»" : q.t))}</span>`;
  requestAnimationFrame(() => requestAnimationFrame(() => quote.firstChild.classList.remove("off")));
  const p = PARTES[q.k];
  let titulo = ok ? (S.racha >= 3 ? `¡Correcto! +${ganados} (racha de ${S.racha})` : `¡Correcto! +${ganados}`)
    : esPon ? (k === null ? `Se acabó el tiempo. La respuesta era: ${q.ops[q.ok]}` : `No. La respuesta correcta es: ${q.ops[q.ok]}`)
    : k === null ? `Se acabó el tiempo. Era ${p.nombre}.` : `No era ${PARTES[k].nombre}: es ${p.nombre}.`;
  if (eq.out) titulo += cfg.equipos ? ` ${eq.nombre} quedó ahorcado.` : " Quedaste ahorcado.";
  const fin = terminado();
  $("#fb").innerHTML = `<div class="fb ${ok?"ok":"no"}" role="status">
    <h3>${esc(titulo)}</h3>
    <p>${esc(q.w)}</p>
    ${esPon ? "" : `<p class="def"><b>${p.nombre}:</b> ${p.def}</p>`}
    ${q.c ? bonusCita(q) : ""}
    <div class="cta"><button class="btn go small" id="next">${fin?"Ver resultados":esPon?"Siguiente pregunta":"Siguiente recorte"}</button></div>
  </div>`;
  $("#next").onclick = siguiente;
  // En proyector la explicación va justo debajo del recorte, para que se vean juntos sin bajar
  if (matchMedia("(min-width:900px)").matches && $(".main .pregunta")) $(".main").insertBefore($("#fb"), $(".main .pregunta"));
  S.bonusListo = false;
  document.querySelectorAll(".bq").forEach(b => b.onclick = () => responderBonus(q, b));
  $("#next").focus({preventScroll:true});
  $("#fb").scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"nearest"});
  $("#scores").innerHTML = scoresHTML();
  publicarVivo();
}

function siguiente(){
  if (terminado()) return final();
  S.i++;
  if (cfg.equipos) { do { S.turno = (S.turno + 1) % S.equipos.length; } while (S.equipos[S.turno].out); }
  ronda(); window.scrollTo(0,0);

// Repaso de los fragmentos en que hubo errores, para estudiar al final
function repasoHTML(){
  if (!S.fallos.length) return "";
  return `<div class="sheet repaso"><h3>Repasa tus errores</h3>${S.fallos.map(({q,k,quien}) => `<article>
    <blockquote><span class="hl" style="${cvar(q.k)}">${conCitas(esc(q.pq ? "«" + q.t + "» " + q.pq : q.t))}</span></blockquote>
    <div class="meta">${cfg.equipos ? esc(quien) + ": " : ""}${q.k === "pon"

// Tabla del proyector: solo los 10 primeros, y cada fila se actualiza sin redibujar toda la tabla
function pintarTabla(js, total){
  const cont = $("#vList"); if (!cont) return;
  const MAX = 10, vis = js.slice(0, MAX), vistos = new Set();
  if (VIVO.filasDe !== cont) { VIVO.filas = {}; VIVO.filasDe = cont; cont.innerHTML = ""; }
  vis.forEach((j, i) => {
    vistos.add(j.id);
    let f = VIVO.filas[j.id];
    if (!f) {
      f = document.createElement("div"); f._err = -1;
      f.innerHTML = `<span class="pos"></span><span class="mh"></span><span class="nm"></span><span class="bar"><i></i></span><span class="estado"></span><span class="pts"></span>`;
      VIVO.filas[j.id] = f;
    }
    f.className = `vrow ${j.out?"out":""} ${j.conectado===false?"off":""} ${i===0&&!j.out?"top":""}`;
    f.querySelector(".pos").textContent = i + 1;
    if (f._err !== (j.err||0)) { f._err = j.err||0; f.querySelector(".mh").innerHTML = horca(j.err||0, {mini:true}); }
    f.querySelector(".nm").textContent = j.nombre || "";
    f.querySelector(".bar i").style.width = Math.min(100, (j.n||0) / total * 100) + "%";
    f.querySelector(".estado").textContent = j.out ? "ahorcado" : j.terminado ? "terminó" : `${j.n||0}/${total}`;
    f.querySelector(".pts").textContent = j.pts || 0;

  });
  Object.keys(VIVO.filas).forEach(id => { if (!vistos.has(id)) { VIVO.filas[id].remove(); delete VIVO.filas[id]; } });
  let mas = cont.querySelector(".vmas");
  if (js.length > MAX) { if (!mas) { mas = document.createElement("p"); mas.className = "vmas note"; } mas.textContent = `y ${js.length - MAX} más jugando`; cont.appendChild(mas); }
  else if (mas) mas.remove();
}

/* Muerte súbita: si hay empate en el primer lugar, solo los empatados responden una pregunta difícil */
function cerrarPartida(){
  if (!VIVO || VIVO.cerrando) return;
  VIVO.cerrando = true;
  const js = rankingVivo(VIVO.jugadores), top = js[0];
  const empatados = top && !top.out && (top.pts || 0) > 0 ? js.filter(j => !j.out && j.conectado !== false && (j.pts || 0) === top.pts) : [];
  if (empatados.length >= 2) iniciarDesempate(empatados.map(j => j.id), 1, top.pts);

}
const nombreDe = id => ((VIVO && VIVO.jugadores[id]) || {}).nombre || "alguien";
function iniciarDesempate(ids, ronda, pts){
  const lista = DIFICILES[cfg.tema] || DIFICILES.ensayo;
  VIVO.desUsadas = VIVO.desUsadas || [];
  let libres = lista.map((_, i) => i).filter(i => !VIVO.desUsadas.includes(i));
  if (!libres.length) { VIVO.desUsadas = []; libres = lista.map((_, i) => i); }
  const q = shuffle(libres)[0]; VIVO.desUsadas.push(q);
  VIVO.ref.update({ estado:"desempate", desempate:{ ids:Object.fromEntries(ids.map(i => [i, true])), orden:ids, tema:cfg.tema in DIFICILES ? cfg.tema : "ensayo", q, ronda, pts, limite:Date.now() + (DES_SEG + 3) * 1000 } });
  Voz.decir(ronda === 1 ? `¡Empate! Muerte súbita entre ${ids.map(nombreDe).join(" y ")}.` : "¡Nadie acertó! Va otra pregunta.", true);
}
function revisarDesempate(){

}
function resolverDesempate(d, resp){
  if (VIVO.resolviendo === d.ronda) return;
  VIVO.resolviendo = d.ronda;
  const aciertos = resp.filter(([, x]) => x.ok).sort((a, b) => (a[1].t || 0) - (b[1].t || 0));
  const lista = DIFICILES[d.tema];
  if (!aciertos.length && d.ronda < 3 && lista.length > VIVO.desUsadas.length) { setTimeout(() => iniciarDesempate(d.orden, d.ronda + 1, d.pts), 2500); return; }
  // Gana quien acertó primero; si nadie acertó en 3 rondas, se mantiene el orden de la tabla
  const gan = aciertos.length ? aciertos[0][0] : d.orden[0];
  VIVO.ref.child("desempate").update({ ganador:gan });
  Voz.decir(`¡${nombreDe(gan)} gana la muerte súbita!`, true);
  setTimeout(() => { if (VIVO) VIVO.ref.update({ [`jugadores/${gan}/dg`]:1, estado:"fin" }); }, 5500);
}
const partesPregunta = t => { const m = t.match(/^«(.+)» (.+)$/); return m ? { frag:m[1], preg:m[2] } : { frag:"", preg:t }; };

/* ---------- Ordena ---------- */
let ultimoEnsayo = -1;
function startOrdena(){
  stopTimer(); S = null;
  let idx; do { idx = Math.floor(Math.random()*ENSAYOS.length); } while (ENSAYOS.length > 1 && idx === ultimoEnsayo);
  ultimoEnsayo = idx;
  const e = ENSAYOS[idx];
  const items = shuffle(e.f.map(([k,t],i)=>({k,t,i})));
  const nuevosEquipos = () => cfg.equipos
    ? cfg.nombres.slice(0,cfg.nEquipos).map((n,i)=>({nombre:(n||"").trim()||`Equipo ${i+1}`, pts:0, err:0, out:false}))
    : [{nombre: cfg.jugador.trim() || "Tú", pts:0, err:0, out:false}];
  const O = { orden:[], equipos:nuevosEquipos(), turno:0, malo:-1, nuevoErr:false, celebrado:false };
  const vivosO = () => O.equipos.filter(x => !x.out);
  const pasarTurno = () => { if (!cfg.equipos || !vivosO().length) return; do { O.turno = (O.turno + 1) % O.equipos.length; } while (O.equipos[O.turno].out); };
  const pintar = () => {
    const eq = O.equipos[O.turno];
    const perdio = vivosO().length === 0, completo = O.orden.length === items.length, fin = perdio || completo;
    const rank = O.equipos.slice().sort((a,b)=>(a.out-b.out) || (b.pts-a.pts) || (a.err-b.err));
    const ganador = rank[0], empate = cfg.equipos && rank.length > 1 && rank[1].out === ganador.out && rank[1].pts === ganador.pts && rank[1].err === ganador.err;
    const msg = fin ? (completo ? "Así queda el ensayo, de principio a fin." : (cfg.equipos ? "Todos los equipos quedaron ahorcados. Este era el orden correcto." : "Quedaste ahorcado. Este era el orden correcto."))
      : O.aviso ? `${esc(O.aviso)} ¿Cuál va en el lugar ${O.orden.length+1}?`
      : O.orden.length === 0 ? "¿Cuál párrafo va primero?" : `Bien. ¿Cuál va en el lugar ${O.orden.length+1}?`;
    O.aviso = "";
    const chips = cfg.equipos ? `<div class="scores">${O.equipos.map((x,i)=>`<span class="score ${!fin && i===O.turno?"turn":""} ${x.out?"out":""}">${horca(x.err,{mini:true})}${esc(x.nombre)} <b>${x.pts}</b></span>`).join("")}</div>` : "";
    const lado = fin && completo ? ganador : eq;
    app.innerHTML = `<div class="hud"><span class="prog">Ordena «${esc(e.tema)}»</span><div style="width:100%">${chips}</div></div>
      ${!fin ? `<div class="turnline">${cfg.equipos ? "Turno de" : "Juega"} <span class="hl" style="${cvar("intro")}">${esc(eq.nombre)}</span></div>` : ""}
      <div class="stage">
        <div class="main"><p class="lead">${msg}</p><div class="olist" id="olist" style="margin-top:14px"></div></div>
        <aside class="side">${horca(lado.err, {animar:O.nuevoErr, estado: fin && completo && !lado.out ? "salvado" : "jugando"})}${fin && completo && !lado.out ? `<div class="lives" style="color:var(--green)">¡Salvado!</div>` : vidasHTML(lado.err)}</aside>
      </div>
      <div id="ofb"></div>
      <div class="cta">${fin
        ? `<button class="btn go" id="otro">Otro ensayo</button><button class="btn" id="home">Volver al inicio</button>`
        : `<button class="btn small" id="reset">Empezar de nuevo</button>`}</div>`;
    O.nuevoErr = false;
    const list = $("#olist");
    if (fin) {
      e.f.forEach(([k,t],j) => {
        const d = document.createElement("div");
        d.className = "strip placed"; d.style.opacity = 1;
        d.innerHTML = `<span class="num">${j+1}</span><span>${conCitas(esc(t))}<br><span class="tag hl" style="${cvar(k)}">${PARTES[k].nombre}</span></span>`;
        list.appendChild(d);
      });
      const titulo = !completo ? "¡Ahorcado!"
        : cfg.equipos ? (empate ? "¡Empate!" : `¡Gana ${esc(ganador.nombre)}!`)
        : (eq.err === 0 ? "¡Orden perfecto, sin fallos!" : `¡Lo lograste con ${eq.err} ${eq.err===1?"fallo":"fallos"}!`);
      const podio = cfg.equipos ? `<div class="podium">${rank.map((x,i)=>`<div class="${x.out?"out":""}">${horca(x.err,{mini:true})}<span>${i+1}. ${esc(x.nombre)}${x.out?" (ahorcado)":""}</span><em>${x.pts} pts</em></div>`).join("")}</div>` : "";
      $("#ofb").innerHTML = `<div class="fb ${completo?"ok":"no"}"><h3>${titulo}</h3>${podio}
        <p>Un ensayo sigue esta ruta: introducción, tesis, argumentos, contraargumento y conclusión. Los argumentos pueden ir en cualquier orden entre sí.</p></div>`;
      $("#otro").onclick = () => startOrdena(); $("#home").onclick = inicio;
      if (!O.celebrado) { O.celebrado = true; if (completo) { Sonido.victoria(); confeti(); } }
      return;
    }
    items.forEach((it, n) => {
      const pos = O.orden.indexOf(n);
      const b = document.createElement("button");
      b.className = "strip" + (pos>=0 ? " placed" : "") + (n===O.malo ? " nope" : "");
      b.innerHTML = `<span class="num">${pos>=0?pos+1:""}</span><span>${conCitas(esc(it.t))}${pos>=0?`<br><span class="tag hl" style="${cvar(it.k)}">${PARTES[it.k].nombre}</span>`:""}</span>`;
      if (pos >= 0) b.disabled = true;
      else b.onclick = () => {
        const esperado = e.f[O.orden.length][0], actual = O.equipos[O.turno];
        if (it.k === esperado) { O.orden.push(n); O.malo = -1; actual.pts += 10; Sonido.acierto(); }
        else {
          actual.err++; O.malo = n; O.nuevoErr = true; Sonido.error(); Sonido.trazo();
          if (actual.err >= MAX_FALLOS) { actual.out = true; setTimeout(() => Sonido.derrota(), 450); }
        }
        // En equipos: si aciertan siguen jugando; si fallan, el turno pasa al siguiente equipo en juego
        if (O.nuevoErr && cfg.equipos && O.orden.length < items.length) {
          pasarTurno(); O.nuevoErr = false;
          if (vivosO().length) O.aviso = `${actual.nombre} se equivocó${actual.out ? " y quedó ahorcado" : ""}. Turno de ${O.equipos[O.turno].nombre}.`;
        }
        pintar();
      };
      list.appendChild(b);
    });
    $("#reset").onclick = () => { O.orden = []; O.equipos = nuevosEquipos(); O.turno = 0; O.malo = -1; pintar(); };
  };
  pintar(); window.scrollTo(0,0);
}

document.addEventListener("keydown", e => {
  if (!S || !$("#answers") || e.target.matches("input")) return;
  if (!S.respondido && /^[1-5]$/.test(e.key)) { const b = document.querySelectorAll(".ans")[+e.key-1]; if (b && !b.disabled) responder(b.dataset.k); }
  else if (!S.respondido && (e.key === "p" || e.key === "P")) usarPista();
  else if (S.respondido && e.key === "Enter" && document.activeElement?.id !== "next" && !document.activeElement?.classList.contains("bq")) { e.preventDefault(); siguiente(); }
});
{ // botón "Menú principal": visible fuera del inicio; en plena partida pide un segundo toque para no salir por accidente
  const btn = $("#goMenu"), txt = btn.querySelector("span"), ETQ = txt.innerHTML; let armado = null;
  const enPartida = () => (VIVO && VIVO.estado !== "fin") || (!!app.querySelector(".stage") && !app.querySelector(".result"));
  btn.onclick = () => {
    if (!enPartida() || armado) { clearTimeout(armado); armado = null; txt.innerHTML = ETQ; inicio(); window.scrollTo(0, 0); return; }
    txt.textContent = "¿Salir? Toca otra vez"; btn.style.borderColor = "var(--red)";
    armado = setTimeout(() => { armado = null; txt.innerHTML = ETQ; btn.style.borderColor = ""; }, 3000);
  };
  $("#goHome").onclick = () => btn.onclick();
  // En la sala en vivo la Guía borraría la partida (y serviría para copiarse), así que se oculta
  new MutationObserver(() => { btn.hidden = !!app.querySelector(".hero"); $("#goGuide").hidden = !!VIVO; if (!armado) btn.style.borderColor = ""; }).observe(app, { childList:true });
  // Avisar antes de recargar o cerrar la pestaña en plena sala
  addEventListener("beforeunload", e => { if (VIVO && VIVO.estado !== "fin" && VIVO.estado !== "cerrada") { e.preventDefault(); e.returnValue = ""; } });
}
$("#goGuide").onclick = guia;
const salaURL = new URLSearchParams(location.search).get("sala");
if (salaURL) unirseSala(salaURL.toUpperCase().slice(0, 4)); else inicio();
</script>
